name: Deploy to Vercel

on:
  push:
    branches: [claude/practical-johnson-a7fxlq]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Mantém o projeto Vercel vinculado entre execuções, para não criar
      # um projeto novo a cada deploy.
      - name: Cache Vercel project link
        uses: actions/cache@v4
        with:
          path: .vercel
          key: vercel-link-${{ github.repository }}

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy to Vercel (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: "https://pmezjrfauulpildtjxxe.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "sb_publishable_Mf-B1T_bcQzekvwmjOSYBA_UzSqFlr-"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Faltou configurar o secret VERCEL_TOKEN no repositório (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Faltou configurar o secret DATABASE_URL no repositório (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          vercel deploy --prod --yes \
            --token="$VERCEL_TOKEN" \
            -e NEXT_PUBLIC_SUPABASE_URL="$NEXT_PUBLIC_SUPABASE_URL" \
            -e NEXT_PUBLIC_SUPABASE_ANON_KEY="$NEXT_PUBLIC_SUPABASE_ANON_KEY" \
            -e DATABASE_URL="$DATABASE_URL" \
            --build-env NEXT_PUBLIC_SUPABASE_URL="$NEXT_PUBLIC_SUPABASE_URL" \
            --build-env NEXT_PUBLIC_SUPABASE_ANON_KEY="$NEXT_PUBLIC_SUPABASE_ANON_KEY" \
            | tee deploy-output.txt

      - name: Show deployment URL
        run: |
          echo "### Deploy concluído" >> "$GITHUB_STEP_SUMMARY"
          tail -1 deploy-output.txt >> "$GITHUB_STEP_SUMMARY"
