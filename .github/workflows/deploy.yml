name: Deploy to Vercel

on:
  push:
    branches: [claude/practical-johnson-a7fxlq]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Mantém o projeto Vercel vinculado entre execuções, para não criar
      # um projeto novo a cada deploy.
      - name: Cache Vercel project link
        uses: actions/cache@v4
        with:
          path: .vercel
          key: vercel-link-${{ github.repository }}

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy to Vercel (production)
        env:
          # Aceita o nome oficial (VERCEL_TOKEN) ou o nome que já foi
          # cadastrado no repositório (FINFAMILY), para não depender de
          # renomear o secret.
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN || secrets.FINFAMILY }}
          NEXT_PUBLIC_SUPABASE_URL: "https://pmezjrfauulpildtjxxe.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "sb_publishable_Mf-B1T_bcQzekvwmjOSYBA_UzSqFlr-"
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.DATABASE || secrets.DB_URL || secrets.SUPABASE_DB_URL }}
        run: |
          set -o pipefail
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Não encontrei o token da Vercel em nenhum secret esperado (VERCEL_TOKEN ou FINFAMILY)."
            exit 1
          fi
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Não encontrei a DATABASE_URL em nenhum secret esperado (DATABASE_URL, DATABASE, DB_URL ou SUPABASE_DB_URL). Diga-me o nome exato que você usou."
            exit 1
          fi
          vercel deploy --prod --yes \
            --token="$VERCEL_TOKEN" \
            -e NEXT_PUBLIC_SUPABASE_URL="$NEXT_PUBLIC_SUPABASE_URL" \
            -e NEXT_PUBLIC_SUPABASE_ANON_KEY="$NEXT_PUBLIC_SUPABASE_ANON_KEY" \
            -e DATABASE_URL="$DATABASE_URL" \
            --build-env NEXT_PUBLIC_SUPABASE_URL="$NEXT_PUBLIC_SUPABASE_URL" \
            --build-env NEXT_PUBLIC_SUPABASE_ANON_KEY="$NEXT_PUBLIC_SUPABASE_ANON_KEY" \
            | tee deploy-output.txt

      - name: Show deployment URL
        run: |
          echo "### Deploy concluído" >> "$GITHUB_STEP_SUMMARY"
          tail -1 deploy-output.txt >> "$GITHUB_STEP_SUMMARY"
